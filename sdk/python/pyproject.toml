[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "querynx"
version = "0.1.0"
description = "Python SDK for the Querynx web intelligence API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["querynx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
