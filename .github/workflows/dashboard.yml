name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/dashboard/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck dashboard
        run: pnpm --filter @querynx/dashboard exec tsc --noEmit
      - name: Production build dashboard
        run: pnpm --filter @querynx/dashboard exec next build
        env:
          NEXT_TELEMETRY_DISABLED: 1
